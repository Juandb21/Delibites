<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: "Segoe UI", Tahoma, sans-serif; background: #fff7f0; color: #0f172a; }
        .topbar { background: linear-gradient(90deg, #e60012, #f0440b); color: white; padding: 14px 48px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 18px rgba(0,0,0,.16); }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand i { font-size: 28px; }
        .brand h1 { font-size: 26px; line-height: 1.1; }
        .brand span { display: block; font-size: 13px; margin-top: 4px; }
        .top-actions { display: flex; align-items: center; gap: 18px; font-weight: 700; }
        .logout-btn { background: rgba(255,255,255,.18); color: white; border-radius: 8px; padding: 12px 18px; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
        .page { width: min(1248px, calc(100% - 56px)); margin: 32px auto; display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
        .panel { background: white; border-radius: 12px; box-shadow: 0 12px 28px rgba(17,24,39,.12); padding: 24px; }
        .panel-title { font-size: 22px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
        .panel-title i { color: #e60012; }
        .table-list { display: grid; gap: 12px; }
        .table-account { width: 100%; text-align: left; border: 2px solid #e5e7eb; background: white; border-radius: 8px; padding: 18px; cursor: pointer; }
        .table-account.active { border-color: #e60012; background: #fff1f2; }
        .table-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .table-account h3 { font-size: 18px; margin-bottom: 12px; }
        .customer { font-size: 14px; color: #334155; margin-bottom: 16px; }
        .badge { background: #ffedd5; color: #c2410c; border-radius: 5px; padding: 5px 8px; font-size: 12px; font-weight: 800; }
        .badge.ready { background: #dcfce7; color: #166534; }
        .total { color: #e60012; font-size: 18px; font-weight: 800; }
        .empty-detail { min-height: 250px; display: grid; place-items: center; text-align: center; color: #475569; }
        .empty-detail i { width: 80px; height: 80px; border-radius: 999px; background: #f1f5f9; color: #94a3b8; display: inline-grid; place-items: center; font-size: 34px; margin-bottom: 18px; }
        .detail-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
        .detail-head h2 { font-size: 26px; }
        .account-total { text-align: right; color: #e60012; font-size: 30px; }
        .section-title { font-size: 18px; margin: 18px 0; display: flex; gap: 10px; align-items: center; }
        .order-box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; background: #f8fafc; margin-bottom: 12px; }
        .order-meta { display: flex; justify-content: space-between; color: #64748b; font-size: 12px; margin-bottom: 12px; }
        .status { background: #dbeafe; color: #1d4ed8; border-radius: 4px; padding: 5px 8px; font-weight: 800; }
        .status.delivered { background: #dcfce7; color: #166534; }
        .line { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
        .line strong { color: #e60012; }
        .summary { border: 1px solid #fed7aa; border-radius: 8px; background: #fff7ed; padding: 24px; margin: 24px 0; }
        .summary .line { font-size: 16px; }
        .summary .grand { border-top: 1px solid #fdba74; margin-top: 8px; padding-top: 12px; font-size: 20px; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .btn { border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; background: white; font-weight: 800; cursor: pointer; }
        .pay-btn { border: 0; background: #059669; color: white; box-shadow: 0 8px 18px rgba(5,150,105,.22); }
        .pay-btn:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; }
        .payment-warning { border: 1px solid #fecaca; background: #fef2f2; color: #991b1b; border-radius: 8px; padding: 14px; font-weight: 700; margin: 18px 0; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.52); z-index: 30; align-items: center; justify-content: center; padding: 18px; }
        .modal.active { display: flex; }
        .modal-card { width: min(460px, 100%); background: white; border-radius: 12px; padding: 24px; box-shadow: 0 18px 42px rgba(0,0,0,.26); }
        .modal-card h3 { font-size: 22px; margin-bottom: 16px; }
        .payment-options { display: grid; gap: 10px; }
        .payment-options button { border: 2px solid #e2e8f0; background: white; border-radius: 8px; padding: 16px; font-weight: 800; cursor: pointer; text-align: left; }
        .payment-options button:hover { border-color: #e60012; background: #fff1f2; }
        @media (max-width: 860px) { .page { grid-template-columns: 1fr; } .topbar { padding: 14px 18px; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <i class="fas fa-hat-chef"></i>
            <div><h1>Panel de Caja</h1><span>Gestión de Cuentas y Pagos</span></div>
        </div>
        <div class="top-actions">
            <span><i class="fas fa-circle-user"></i> {{ user.first_name|default:user.username }}</span>
            <a class="logout-btn" href="{% url 'logout' %}"><i class="fas fa-arrow-right-from-bracket"></i> Salir</a>
        </div>
    </header>

    <main class="page">
        <aside class="panel">
            <h2 class="panel-title"><i class="fas fa-money-bill-wave"></i> Mesas Ocupadas</h2>
            <div class="table-list" id="tableList"></div>
        </aside>
        <section class="panel" id="detailPanel">
            <div class="empty-detail">
                <div>
                    <i class="fas fa-receipt"></i>
                    <h2>Seleccione una mesa</h2>
                    <p>Seleccione una mesa ocupada para ver el detalle de la cuenta</p>
                </div>
            </div>
        </section>
    </main>

    <div class="modal" id="paymentModal">
        <div class="modal-card">
            <h3>Seleccione método de pago</h3>
            <div class="payment-options">
                <button type="button" onclick="processPayment('efectivo')"><i class="fas fa-money-bill"></i> Efectivo</button>
                <button type="button" onclick="processPayment('tarjeta')"><i class="fas fa-credit-card"></i> Tarjeta</button>
                <button type="button" onclick="processPayment('transferencia')"><i class="fas fa-building-columns"></i> Transacción</button>
            </div>
            <button class="btn" style="width:100%; margin-top:14px;" onclick="closePaymentModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const mesas = {{ mesas_caja_json|safe }};
        let selectedMesa = null;

        function renderTables() {
            const list = document.getElementById('tableList');
            if (!mesas.length) {
                list.innerHTML = '<div style="color:#64748b;">No hay cuentas pendientes.</div>';
                return;
            }
            list.innerHTML = mesas.map(mesa => `<button class="table-account ${selectedMesa?.numero === mesa.numero ? 'active' : ''}" onclick="selectMesa(${mesa.numero})">
                <div class="table-row"><h3>Mesa ${mesa.numero}</h3><span class="badge ${mesa.puede_pagar ? 'ready' : ''}">${mesa.puede_pagar ? 'Listo para pagar' : `${mesa.pendientes_entrega_count} en preparación`}</span></div>
                <div class="customer">${mesa.cliente}</div>
                <div class="table-row"><span>Total:</span><span class="total">${mesa.total_display}</span></div>
            </button>`).join('');
        }

        function selectMesa(numero) {
            selectedMesa = mesas.find(mesa => mesa.numero === numero);
            renderTables();
            renderDetail();
        }

        function renderDetail() {
            const panel = document.getElementById('detailPanel');
            const orders = selectedMesa.pedidos.map(order => `<div class="order-box">
                <div class="order-meta"><span class="status ${order.estado === 'entregado' ? 'delivered' : ''}">${order.estado_display}</span><span>${order.hora}</span></div>
                ${order.detalles.map(item => `<div class="line"><span><strong>${item.cantidad}x</strong> ${item.producto}</span><span>${item.subtotal_display}</span></div>`).join('')}
                <div class="line" style="border-top:1px solid #cbd5e1; margin-top:8px; padding-top:12px;"><span>Subtotal:</span><strong>${order.subtotal_display}</strong></div>
            </div>`).join('');

            panel.innerHTML = `<div class="detail-head">
                <div><h2>Mesa ${selectedMesa.numero}</h2><p>${selectedMesa.cliente}</p></div>
                <div><span>Cuenta Total</span><div class="account-total">${selectedMesa.total_display}</div></div>
            </div>
            <h3 class="section-title"><i class="fas fa-receipt"></i> Detalle de Pedidos</h3>
            ${orders}
            <div class="summary">
                <h3 class="section-title" style="margin-top:0;"><i class="fas fa-dollar-sign"></i> Resumen de Pago</h3>
                <div class="line"><span>Subtotal:</span><span>${selectedMesa.total_display}</span></div>
                <div class="line"><span>Propina sugerida (10%):</span><span>${selectedMesa.propina_display}</span></div>
                <div class="line grand"><span>Total sugerido:</span><strong>${selectedMesa.total_sugerido_display}</strong></div>
            </div>
            ${selectedMesa.puede_pagar ? '' : `<div class="payment-warning"><i class="fas fa-triangle-exclamation"></i> No se puede cobrar todavía. Faltan ${selectedMesa.pendientes_entrega_count} pedido(s) por quedar listos.</div>`}
            <div class="actions">
                <button class="btn" onclick="clearSelection()">Cancelar</button>
                <button class="btn pay-btn" onclick="openPaymentModal()" ${selectedMesa.puede_pagar ? '' : 'disabled'}><i class="fas fa-credit-card"></i> Procesar Pago</button>
            </div>`;
        }

        function clearSelection() {
            selectedMesa = null;
            renderTables();
            document.getElementById('detailPanel').innerHTML = `<div class="empty-detail"><div><i class="fas fa-receipt"></i><h2>Seleccione una mesa</h2><p>Seleccione una mesa ocupada para ver el detalle de la cuenta</p></div></div>`;
        }

        function openPaymentModal() {
            if (!selectedMesa) return;
            if (!selectedMesa.puede_pagar) {
                alert('No se puede procesar el pago hasta que todos los pedidos de la mesa estén listos para entregar.');
                return;
            }
            document.getElementById('paymentModal').classList.add('active');
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('active');
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            return parts.length === 2 ? parts.pop().split(';').shift() : '';
        }

        async function processPayment(method) {
            if (!selectedMesa || !selectedMesa.puede_pagar) {
                alert('No se puede procesar el pago hasta que todos los pedidos de la mesa estén listos para entregar.');
                return;
            }
            const response = await fetch("{% url 'procesar_pago' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify({ mesa_numero: selectedMesa.numero, metodo_pago: method })
            });
            const data = await response.json();
            if (!data.success) {
                alert(data.error || 'No se pudo procesar el pago.');
                return;
            }
            window.location.href = data.factura_url;
        }

        renderTables();
    </script>
</body>
</html>
